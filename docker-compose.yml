version: '3.8'

services:
  backend:
    image: php:8.2-apache
    container_name: zeno-backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: shuttle.proxy.rlwy.net
      DB_PORT: 49500
      DB_USER: root
      DB_PASSWORD: kKstpHtYMOihIMGuSTbrcWvjYjLTsDAx
      DB_NAME: railway
      JWT_SECRET: zeno_crm_jwt_secret_key_2024
    ports:
      - "8080:80"
    command: >
      bash -c "
        docker-php-ext-install pdo pdo_mysql &&
        apt-get update -qq && apt-get install -y -qq unzip git &&
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer &&
        cd /var/www/html && composer install --no-interaction --no-progress 2>/dev/null || true &&
        a2enmod rewrite headers &&
        echo 'ServerName localhost' >> /etc/apache2/apache2.conf &&
        sed -i 's/AllowOverride None/AllowOverride All/g' /etc/apache2/apache2.conf &&
        apache2-foreground
      "

  frontend:
    image: node:18-alpine
    container_name: zeno-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build && npm install -g serve && serve -s dist -l 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8080/api

volumes:
  db_data:
    driver: local
